<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="QualiScope turns requirements, user stories and change requests into traceable, reviewable SIT/UAT test packs." />
    <meta name="theme-color" content="#f6f7f9" />
    <title>QualiScope - AI Requirement Analyzer</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23818cf8'/%3E%3Cstop offset='1' stop-color='%234f46e5'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M6 17h5l3-8 4 14 3-6h5' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" />
    <script>
      // Pick the theme before CSS paints to avoid a flash of the wrong palette.
      (function () {
        try {
          var themes = ["porcelain", "midnight", "navy", "graphite", "evergreen"];
          var id = localStorage.getItem("qs_theme");
          if (themes.indexOf(id) < 0) id = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "midnight" : "porcelain";
          document.documentElement.setAttribute("data-theme", id);
        } catch (e) { /* storage blocked: CSS default theme applies */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
